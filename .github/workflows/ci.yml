name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Playwright 1.56 can't install Chromium on ubuntu-latest (Ubuntu 26.04) yet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: mkdir -p tmp/heap && npm test
        env:
          # an intermittent out-of-memory crash in a test worker: trace each test's heap, and write a
          # heap snapshot (uploaded below) when a process nears a 1 GB heap; a test file uses ~50 MB
          STEPLIGHT_HEAP_TRACE: "1"
          NODE_OPTIONS: --max-old-space-size=1024 --heapsnapshot-near-heap-limit=1 --diagnostic-dir=tmp/heap
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: tmp/e2e-out/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: heap-snapshots
          path: tmp/heap/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t steplight:ci .
      - name: Smoke test under /steplight with an access key
        run: |
          docker run -d --name sl --init --shm-size=1g -p 4100:4100 \
            -e STEPLIGHT_BASE_URL=http://localhost:4100/steplight -e STEPLIGHT_ACCESS_KEY=ci-key steplight:ci
          for i in $(seq 1 30); do curl -sf http://localhost:4100/steplight/api/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4100/steplight/api/projects)" = "401"
          curl -sf -X POST -H 'X-Steplight-Key: ci-key' -H 'Content-Type: application/json' -d '{"languages":["en"]}' \
            http://localhost:4100/steplight/api/demo-project | grep -q processIds
      - if: failure()
        run: docker logs sl
